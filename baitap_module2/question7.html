<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuyến mãi</title>
</head>

<body>
    <p style="color: green;font-size: 30dp;">Phiếu đăng kí tham gia chương trình </p>
    <table border="1">
        <tr>
            <td> Họ và tên</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Địa chỉ</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Điện thoại</td>
            <td><input type="number"></td>
        </tr>
        <tr>
            <td>Phái</td>
            <td>
                <label for=""><input type="radio" name="sex">Nam</label>
                <label for=""><input type="radio" name="sex">Nữ</label>
            </td>
        </tr>
        <tr>
            <td>Nghề nghiệp</td>
            <td>
                <select name="" id="">
                    <option value="1">Bác sĩ</option>
                    <option value="2">Kỹ sư</option>
                    <option value="3">Giáo viên</option>
                    <option value="4">Khác</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Chọn sản phẩm tham gia</td>
            <td>
                <select name="" id="" multiple>
                    <option value="">Kem đánh răng</option>
                    <option value="">Bột giặt</option>
                    <option value="">Dầu gội đầu</option>
                    <option value="">Sữa tắm</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Số người dự đoán tham gia</td>
            <td><input type="number"></td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <button style="align-items: center;">Đồng ý</button>
            </td>
        </tr>
        <tr>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td colspan="2" style="color: red;"><i>Bạn đã đăng kí thành công</i></td>
        </tr>
    </table>
    <button onclick="window.location.href='../excerciseCollection.html'">quay lại trang
        chủ</button>
</body>

</html>
